name: Release

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

# Only one release process may mutate versions, tags, GitHub releases, and
# Marketplace state at a time. A second run queues behind the first.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # Prevent recursive releases — skip commits made by semantic-release bot
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, 'chore(release)')"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "npm"

      - run: npm ci

      - name: Verify lockfile reproducibility
        run: git diff --exit-code -- package.json package-lock.json

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Format check
        run: npm run format:check

      - name: Audit dependencies
        run: npm run audit:deps

      # Packaging is owned by semantic-release. The prepareCmd runs
      # `npm run package:verified`, which creates the atomic, checksummed VSIX
      # and enforces the bundle and VSIX size budgets against that exact
      # artifact. The resulting VSIX and checksum are attached to the GitHub
      # Release.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
